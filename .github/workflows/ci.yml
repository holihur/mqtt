name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Install Task
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          task --version

      - name: Build
        run: task build

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8.0

      - name: Test (race)
        run: go test -race -count=1 -run Test -v ./... 2>&1 | tail -n 100

      - name: Test cluster
        run: go test -race -count=1 -run TestCluster -v ./internal/broker

      - name: Bench smoke
        run: go test -run=^$ -bench=. ./... -benchmem -benchtime=1x 2>&1 | head -n 40

      - name: Coverage (internal)
        run: |
          go test ./internal/... -coverprofile=cover.out -covermode=atomic 2>&1 | tail -n 20
          go tool cover -func=cover.out | tail -n 30
          echo "total=$(go tool cover -func=cover.out | grep total | awk '{print $3}')" >> $GITHUB_ENV
          # also full repo for codecov
          go test ./... -coverprofile=coverall.out -covermode=atomic 2>&1 | tail -n 20 || true

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverall.out
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Fuzz (3s, GitHub only)
        run: task fuzz 2>&1 | tail -n 30

      - name: Govulncheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "govulncheck: stdlib vulns in go1.25.9, fixed in 1.25.11 (tracked)"

      - name: Bench report
        run: |
          go test -bench=. -benchtime=1x -benchmem ./bench 2>&1 | tee bench.txt
          cat bench.txt

      - name: Update README bench
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          GOOS=$(grep -m1 "^goos:" bench.txt || echo "goos: linux")
          GOARCH=$(grep -m1 "^goarch:" bench.txt || echo "goarch: amd64")
          CPU=$(grep -m1 "^cpu:" bench.txt || echo "cpu: unknown")
          BENCH10K=$(grep "Benchmark10kClients" bench.txt | head -n1 | xargs || echo "Benchmark10kClients n/a")
          BENCHPUB=$(grep "BenchmarkPublishThroughput" bench.txt | head -n1 | xargs || echo "BenchmarkPublishThroughput n/a")
          cat > /tmp/bench_block.md <<EOF
          > 更新: $DATE | $GOOS $GOARCH | $CPU
          >
          > \`\`\`
          > $(cat bench.txt | grep -E "^(goos|goarch|cpu|Benchmark)" | head -n 20)
          > \`\`\`
          >
          > - $BENCH10K
          > - $BENCHPUB
          > - 详见 [\`docs/bench.md\`](docs/bench.md) 与 Artifacts \`bench.txt\`/\`c10k.txt\`
          EOF
          cat /tmp/bench_block.md
          python3 << 'PY'
          import re, pathlib
          p = pathlib.Path("README.md")
          s = p.read_text(encoding="utf-8")
          block = pathlib.Path("/tmp/bench_block.md").read_text(encoding="utf-8")
          new = re.sub(r"<!-- BENCH_START -->.*?<!-- BENCH_END -->", lambda _: f"<!-- BENCH_START -->\n{block}\n<!-- BENCH_END -->", s, flags=re.S)
          if new != s:
              p.write_text(new, encoding="utf-8")
              print("README.md updated")
          else:
              print("README.md unchanged")
          PY
          # also sync docs/bench.md header if exists
          if [ -f docs/bench.md ]; then
            echo -e "\n# Bench $(date -u +%Y-%m-%d)\n\n\`\`\`\n$(cat bench.txt)\n\`\`\`" >> /tmp/docs_bench_append || true
          fi
          if git diff --quiet README.md; then
            echo "no README changes to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto-update bench $DATE [skip ci]" || exit 0
          git push || echo "push failed (maybe protected branch)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mosquitto clients
        run: sudo apt-get update && sudo apt-get install -y mosquitto-clients

      - name: Verify broker starts (memory)
        timeout-minutes: 2
        run: |
          set -e
          ./bin/broker -tcp :11883 -ws :18083 -redis "" -pprof :0 -allow-anonymous true &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true' EXIT
          sleep 2
          mosquitto_pub -h 127.0.0.1 -p 11883 -t ci/test -m hello -d
          mosquitto_sub -h 127.0.0.1 -p 11883 -t "ci/#" -C 1 -W 5 &
          sub=$!
          sleep 0.5
          mosquitto_pub -h 127.0.0.1 -p 11883 -t ci/hello -m world
          wait $sub
          kill $pid || true
          wait $pid || true
          trap - EXIT

      - name: Verify broker starts (redis)
        timeout-minutes: 2
        run: |
          set -e
          ./bin/broker -tcp :11883 -ws :18083 -redis 127.0.0.1:6379 -pprof :0 -allow-anonymous true &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true' EXIT
          sleep 2
          mosquitto_pub -h 127.0.0.1 -p 11883 -t ci/redis -m hello -d
          kill $pid || true
          wait $pid || true
          trap - EXIT

  c10k:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o bin/broker ./cmd/broker
      - name: Tune limits
        run: |
          ulimit -n 65536
          ulimit -n
          sysctl -w net.core.somaxconn=65535 2>/dev/null || true
          sysctl -w net.ipv4.tcp_max_syn_backlog=65535 2>/dev/null || true
          sysctl -w net.core.netdev_max_backlog=5000 2>/dev/null || true
      - name: c10k 10k/60s
        run: go test -run TestC10k -count=1 -v ./bench -c10k-n=10000 -c10k-hold=60s 2>&1 | tee c10k.txt; tail -n 40 c10k.txt
      - name: Upload c10k log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: c10k-log
          path: c10k.txt
