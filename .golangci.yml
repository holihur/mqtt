version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - funlen
    - gocyclo
    - gocognit
    - lll
    - cyclop
  settings:
    funlen:
      lines: 120
      statements: 80
    gocyclo:
      min-complexity: 25
    gocognit:
      min-complexity: 40
    lll:
      line-length: 150
    cyclop:
      max-complexity: 20
      package-average: 15.0
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - broker_test.go
      - codec_test.go
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
          - staticcheck
      - path: internal/broker/broker.*\.go
        linters:
          - funlen
          - gocyclo
          - gocognit
          - cyclop
          - lll
formatters:
  enable:
    - gofmt
    - goimports
